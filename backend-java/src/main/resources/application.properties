spring.application.name=memgraph-api

# Use environment variable instead of hardcoding
spring.ai.openai.api-key=${GROQ_API_KEY}

# Groq endpoint
spring.ai.openai.base-url=https://api.groq.com/openai

# Model
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile


# Dezactivam embedding-ul pe clientul OpenAI (deoarece Groq nu suporta/nu vrem sa-l folosim pentru asta)
spring.ai.openai.embedding.enabled=false

# Configurare Ollama local pentru vectorizare (Embeddings)
spring.ai.ollama.base-url=http://localhost:11434

# Activam chat-ul (LLM-ul) prin Ollama
spring.ai.ollama.chat.enabled=false
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text

